name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Paket ini mendukung PHP 8.1+; uji yang tertua dan yang terbaru.
        php: ['8.1', '8.2', '8.3', '8.4']
        dependencies: [highest]
        include:
          # Sekali jalan dengan versi dependency paling tua yang masih memenuhi
          # composer.json, supaya batas bawahnya ikut teruji.
          - php: '8.1'
            dependencies: lowest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - run: composer validate --strict

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - run: vendor/bin/phpunit
