name: Release

# Paket Composer diterbitkan lewat tag: Packagist membaca tag dari repo ini.
#
#   git tag v0.1.0
#   git push --follow-tags
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Dibutuhkan untuk membuat GitHub Release di bawah.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: curl, json, mbstring
          coverage: none

      - run: composer validate --strict
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpunit

      - name: Buat GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Langkah terakhir
        run: |
          NAME="$(php -r 'echo json_decode(file_get_contents("composer.json"))->name;')"
          {
            echo "### $GITHUB_REF_NAME sudah dirilis"
            echo
            echo '```bash'
            echo "composer require $NAME:^${GITHUB_REF_NAME#v}"
            echo '```'
            echo
            echo "Halaman paketnya: https://packagist.org/packages/$NAME"
          } >> "$GITHUB_STEP_SUMMARY"

  # Packagist baru diberi tahu setelah test di tag ini lulus dan rilisnya dibuat.
  packagist:
    needs: release
    uses: ./.github/workflows/packagist.yml
    secrets: inherit
